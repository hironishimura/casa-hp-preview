name: Instagram 自動投稿

on:
  schedule:
    # いずれも 10:00（日本時間）＝ UTC 01:00。
    # GitHub 側の都合で数分〜数十分ずれることがあります。
    #
    # 2026-11-05 までは「1日おき」、以降は「週2回（火・金）」で運用します。
    # 毎日起動しておき、実際に投稿するかは
    # 下の「今日が投稿日か判定する」ステップで決めます。
    # （cron の */2 は月末で連日になるため、判定はジョブ側に持たせています）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        type: choice
        default: 'check'
        options:
          - check
          - dry-run
          - post
      slug:
        description: '施工例を指定して投稿する（空なら次の未投稿）'
        type: string
        default: ''
      count:
        description: '連続で投稿する件数（postのときだけ有効・初期のストック作り用）'
        type: string
        default: '1'

# 実行が重なって同じ施工例を二重投稿しないようにする
concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # posted.json を書き戻すため

    steps:
      - uses: actions/checkout@v4

      - name: 今日が投稿日か判定する
        id: gate
        if: github.event_name == 'schedule'
        run: |
          # 開設直後はストックを厚くするため頻度を上げ、
          # 落ち着いたら週2回に戻す。切替日はここだけ直せばよい。
          SWITCH='2026-11-05'
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          DAY=$(TZ=Asia/Tokyo date +%d)
          DOW=$(TZ=Asia/Tokyo date +%u)   # 1=月 … 7=日

          if [[ "$TODAY" < "$SWITCH" ]]; then
            # 1日おき（偶数日）。曜日は問わないので土日も投稿する。
            if [ $((10#$DAY % 2)) -eq 0 ]; then
              echo "1日おき期間（$SWITCH まで）の投稿日です。"
            else
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              echo "奇数日のためスキップします。"
            fi
          else
            case "$DOW" in
              2|5) echo "週2回（火・金）の投稿日です。" ;;
              *)   echo 'skip=true' >> "$GITHUB_OUTPUT"
                   echo "火・金ではないためスキップします。" ;;
            esac
          fi

      - name: 投稿する
        if: steps.gate.outputs.skip != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODE: ${{ inputs.mode }}
          SLUG: ${{ inputs.slug }}
          COUNT: ${{ inputs.count }}
        run: |
          # 定時実行（inputs なし）は本番投稿。手動実行は既定で check。
          ARGS=()
          COUNT="${COUNT:-1}"
          case "${MODE:-post}" in
            check)   ARGS+=(--check); COUNT=1 ;;
            dry-run) ARGS+=(--dry-run); COUNT=1 ;;
          esac
          if [ -n "$SLUG" ]; then ARGS+=(--slug "$SLUG"); fi

          for i in $(seq 1 "$COUNT"); do
            if [ "$COUNT" -gt 1 ]; then echo "===== $i / $COUNT 件目 ====="; fi
            python3 scripts/instagram/post.py "${ARGS[@]}"
            # 短時間に連続投稿するとスパムとみなされうるので間隔を空ける
            if [ "$i" -lt "$COUNT" ]; then echo "(3分待機)"; sleep 180; fi
          done

      - name: 投稿履歴を記録する
        if: (inputs.mode == 'post' || inputs.mode == '') && steps.gate.outputs.skip != 'true'
        run: |
          if git diff --quiet scripts/instagram/posted.json; then
            echo "履歴に変化がないためコミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/instagram/posted.json
          git commit -m "記録: Instagram へ投稿した施工例"
          git pull --rebase --autostash
          git push
